<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon carnet</title>
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{color-scheme:light;--bg:#fcfaf5;--card:#ffffff;--side:#ffffff;--onbtn:#2b2416;--ink:#2b2416;--mute:#7a6f58;--gold:#b8903a;--gold2:#e0c070;--goldbg:#f8f0dc;--line:#ece2c8;--warn:#b3402a;--serif:"Playfair Display","Iowan Old Style",Georgia,serif;--sans:"Lato",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--shadow:0 1px 2px color-mix(in srgb,var(--ink) 6%,transparent),0 8px 24px color-mix(in srgb,var(--ink) 9%,transparent)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{font:18px/1.55 var(--sans);color:var(--ink);display:flex;background:radial-gradient(900px 420px at 88% -8%,color-mix(in srgb,var(--gold2) 45%,var(--bg)) 0%,transparent 62%),radial-gradient(700px 400px at -5% 105%,color-mix(in srgb,var(--gold2) 30%,var(--bg)) 0%,transparent 60%),var(--bg);background-attachment:fixed}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--gold);font-weight:700;text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:3px solid var(--gold2);outline-offset:2px}
.i{width:1.05em;height:1.05em;vertical-align:-.17em;margin-right:.4em;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.item,.tile,.srow,.hero{animation:rise .45s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,0s)}
/* menu */
aside{width:292px;background:color-mix(in srgb,var(--side) 88%,transparent);backdrop-filter:blur(8px);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);flex-shrink:0}
.logo{display:flex;align-items:center;gap:14px;padding:26px 22px 8px}
.mark{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;color:var(--onbtn);background:linear-gradient(135deg,var(--gold2),var(--gold) 60%,color-mix(in srgb,var(--gold) 70%,#000));box-shadow:0 6px 16px color-mix(in srgb,var(--gold) 45%,transparent),inset 0 1px 0 rgba(255,255,255,.5)}
.mark .i{width:26px;height:26px;margin:0}
.logo b{display:block;font:700 1.5rem/1.1 var(--serif)}
.logo small{color:var(--mute);font-size:.82rem;letter-spacing:.04em}
.rule{height:1px;margin:16px 22px 6px;background:linear-gradient(90deg,var(--gold2),transparent)}
.navt{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700;padding:10px 24px 6px}
nav{flex:1;overflow-y:auto;padding:0 12px}
nav button{display:flex;width:100%;align-items:center;gap:12px;background:none;border:0;text-align:left;padding:10px 12px;border-radius:14px;margin-bottom:3px;transition:background .15s,transform .15s}
nav button:hover{background:var(--goldbg);transform:translateX(2px)}
nav button.on{background:var(--goldbg);font-weight:700;box-shadow:inset 4px 0 0 var(--gold),0 3px 10px color-mix(in srgb,var(--gold) 20%,transparent)}
nav .ic{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:var(--goldbg);color:var(--gold);flex-shrink:0}
nav button.on .ic{background:var(--card)}
nav .ic .i{margin:0;width:20px;height:20px}
nav .n{margin-left:auto;font-size:.78rem;font-weight:700;background:var(--gold);color:var(--onbtn);border-radius:99px;min-width:1.6rem;text-align:center;padding:0 7px}
nav .n:empty{display:none}
.side-foot{padding:12px;border-top:1px solid var(--line);display:grid;gap:6px}
.side-foot button{background:none;border:1px solid var(--line);padding:9px;border-radius:12px;font-size:.88rem;color:var(--mute);transition:.15s}
.side-foot button:hover{border-color:var(--gold);color:var(--ink);background:var(--card)}
.btn,.side-foot button{display:inline-flex;align-items:center;justify-content:center}
.side-foot .i{margin-right:.5em}
/* page */
main{flex:1;min-width:0;overflow-y:auto;padding:22px 34px calc(100px + env(safe-area-inset-bottom))}
.wrap{max-width:860px;margin:0 auto}
.top{display:flex;gap:10px;align-items:center;margin-bottom:20px}
#menu{display:none;background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--onbtn);border:0;border-radius:14px;padding:12px 14px}
#menu .i{margin:0}
.top input{flex:1;padding:14px 20px;border:1px solid var(--line);border-radius:99px;background:var(--card);min-width:0;box-shadow:var(--shadow)}
.top input:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--gold2) 35%,transparent)}
.hero{position:relative;overflow:hidden;border-radius:26px;padding:30px 32px;background:linear-gradient(135deg,color-mix(in srgb,var(--gold2) 80%,#fff) 0%,color-mix(in srgb,var(--gold) 70%,var(--gold2)) 50%,var(--gold) 100%);box-shadow:0 14px 34px color-mix(in srgb,var(--gold) 38%,transparent),inset 0 1px 0 color-mix(in srgb,var(--card) 60%,transparent);color:var(--onbtn)}
.hero::before{content:"";position:absolute;inset:-40% -10% auto auto;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.55),transparent 65%)}
.hero .deco{position:absolute;right:26px;bottom:-14px;opacity:.18}
.hero .deco .i{width:150px;height:150px;margin:0;stroke-width:1}
.hdate{position:relative;font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;font-weight:700;opacity:.75}
.hero h2{position:relative;font:700 2.5rem/1.15 var(--serif);margin:6px 0 4px}
.hsum{position:relative;font-size:1.1rem;margin:0 0 16px}
.hero .btn{position:relative;background:rgba(255,255,255,.55);box-shadow:none;border:1px solid rgba(255,255,255,.8);font-weight:700;padding:8px 16px;font-size:.9rem}
h2.t2,.sec{font:700 1.5rem var(--serif);margin:30px 0 14px;display:flex;align-items:center;gap:12px}
.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold2),transparent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-top:24px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px 16px;text-align:left;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s,border-color .2s;position:relative;overflow:hidden}
.tile:hover{transform:translateY(-4px);border-color:var(--ac);box-shadow:0 14px 30px color-mix(in srgb,var(--ink) 16%,transparent)}
.tile:active{transform:scale(.98)}
.tic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;color:var(--onbtn);background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 70%,var(--card)),var(--ac));box-shadow:0 6px 14px color-mix(in srgb,var(--ac) 40%,transparent)}
.tic .i{width:28px;height:28px;margin:0}
.tile b{font:700 1.08rem/1.25 var(--serif)}
.tile small{color:var(--mute);font-size:.88rem;margin-top:-6px}
.srow{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 16px;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s}
.srow:hover{transform:translateX(3px)}
.srow.late{border-color:var(--warn)}
.srow .t{font-weight:700}
.nothing{color:var(--mute);text-align:center;padding:22px;border:1px dashed var(--gold2);border-radius:18px;background:color-mix(in srgb,var(--card) 60%,transparent)}
h2#title{font:700 2.3rem/1.15 var(--serif);margin:6px 0 2px}
.sub{color:var(--mute);margin:0 0 6px;letter-spacing:.02em}
.line{height:3px;width:70px;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:3px;margin:10px 0 20px}
.btn{background:linear-gradient(135deg,var(--gold2),var(--gold) 55%,var(--gold));color:var(--onbtn);border:0;border-radius:14px;padding:13px 24px;font-weight:700;box-shadow:0 5px 14px color-mix(in srgb,var(--gold) 35%,transparent),inset 0 1px 0 rgba(255,255,255,.5);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 18px color-mix(in srgb,var(--gold) 42%,transparent),inset 0 1px 0 rgba(255,255,255,.5)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--card);box-shadow:none;border:1px solid var(--line);font-weight:400}
.btn.del{background:var(--card);box-shadow:none;color:var(--warn);border:1px solid var(--warn);font-weight:400}
.bar{display:flex;gap:10px;flex-wrap:wrap}
.quick{display:flex;gap:8px;margin-top:18px}
.quick input{flex:1;padding:13px 18px;border:2px solid var(--gold2);border-radius:14px;background:var(--card);min-width:0}
.list{display:grid;gap:14px;margin-top:20px}
.item{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 18px;display:flex;gap:14px;align-items:flex-start;box-shadow:var(--shadow),inset 5px 0 0 var(--ac,var(--gold));transition:transform .15s,box-shadow .15s}
.item:hover{transform:translateY(-2px)}
.item.done{opacity:.5}
.item.done .t{text-decoration:line-through}
.item.late{border-color:var(--warn)}
.item input[type=checkbox]{width:28px;height:28px;margin-top:2px;accent-color:var(--gold);flex-shrink:0}
.item .body{flex:1;min-width:0;cursor:pointer;padding-left:4px}
.t{font-weight:700;overflow-wrap:anywhere;font-size:1.05rem}
.m{white-space:pre-line;color:var(--mute);font-size:.95rem;margin-top:2px;overflow-wrap:anywhere}
.m .i{color:var(--gold)}
.chip{display:inline-block;background:var(--goldbg);border:1px solid var(--line);border-radius:99px;padding:0 11px;margin:2px 6px 2px 0;font-size:.86rem;color:var(--ink)}
.chip .i{color:var(--gold);margin-right:.3em}
.chip.gold{background:var(--goldbg);border-color:var(--gold);font-weight:700}
.chip.hot{background:color-mix(in srgb,var(--warn) 10%,var(--card));border-color:var(--warn);color:var(--warn);font-weight:700}
.big{font:700 1.2rem var(--serif);color:var(--gold)}
.date{width:60px;flex-shrink:0;text-align:center;border-radius:14px;background:linear-gradient(160deg,var(--card),var(--goldbg));border:1px solid var(--gold2);padding:5px 0;line-height:1.1}
.date b{display:block;font:700 1.7rem var(--serif)}
.date span{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}
.amt{font:700 1.35rem var(--serif);color:var(--gold);white-space:nowrap}
.empty{color:var(--mute);padding:30px 0;text-align:center;border:1px dashed var(--gold2);border-radius:20px;background:color-mix(in srgb,var(--card) 60%,transparent)}
.fab{display:none;position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:50%;border:0;place-items:center;color:var(--onbtn);background:linear-gradient(135deg,color-mix(in srgb,var(--gold2) 80%,#fff),var(--gold) 60%,var(--gold));box-shadow:0 10px 26px color-mix(in srgb,var(--gold) 60%,transparent),inset 0 1px 0 color-mix(in srgb,var(--card) 60%,transparent);z-index:5}
.fab .i{width:28px;height:28px;margin:0;stroke-width:2.2}
dialog{border:0;border-radius:24px;padding:0;width:min(94vw,560px);max-height:92vh;overflow:auto;background:var(--card);color:var(--ink);box-shadow:0 30px 80px rgba(60,45,10,.4)}
dialog::backdrop{background:rgba(43,36,22,.5);backdrop-filter:blur(3px)}
dialog form,dialog>h3,dialog>p,dialog>.row{margin-left:26px;margin-right:26px}
dialog h3{font:700 1.6rem var(--serif);margin:0;padding:24px 0 12px;border-bottom:2px solid;border-image:linear-gradient(90deg,var(--gold2),transparent) 1}
dialog form h3{margin:0}
dialog form{padding-bottom:24px}
dialog>.row{padding-bottom:24px}
label{display:block;font-weight:700;margin:14px 0 5px;font-size:.92rem}
dialog input:not([type=checkbox]),dialog textarea,dialog select{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
dialog input:focus,dialog textarea:focus,dialog select:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--gold2) 30%,transparent)}
.chk{display:flex;gap:16px;flex-wrap:wrap}
.chk label{font-weight:400;margin:0;display:flex;gap:6px;align-items:center;font-size:1rem}
.chk input{width:20px;height:20px;accent-color:var(--gold)}
.row{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.row .sp{flex:1}
.icons{display:flex;flex-wrap:wrap;gap:6px}
.icons button{width:46px;height:46px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--gold);display:grid;place-items:center;padding:0}
.icons button.on{background:var(--goldbg);border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold2) 35%,transparent)}
.icons .i{width:22px;height:22px;margin:0}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 22px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
#toast.on{opacity:1}
#scrim{display:none}
@media(max-width:800px){
 aside{position:fixed;inset:0 auto 0 0;z-index:20;transform:translateX(-100%);transition:transform .25s;width:min(320px,88vw);background:var(--side)}
 body.open aside{transform:none;box-shadow:0 0 50px rgba(0,0,0,.35)}
 body.open #scrim{display:block;position:fixed;inset:0;background:rgba(43,36,22,.45);z-index:10}
 #menu{display:block}
 .fab{display:grid}
 main{padding:calc(14px + env(safe-area-inset-top)) 14px 110px}
 .hero{padding:24px 22px;border-radius:22px}
 .hero h2{font-size:2rem}
 h2#title{font-size:1.8rem}
 .tiles{grid-template-columns:repeat(2,1fr);gap:12px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.warn{background:color-mix(in srgb,var(--warn) 10%,var(--card));border:1px solid var(--warn);color:var(--warn);border-radius:16px;padding:14px 18px;margin-bottom:16px;font-size:.95rem}
.status{font-size:.8rem;text-align:center;padding:0 0 4px;color:var(--mute)}
.status.ok .i{color:#4f9a6a}.status.bad{color:var(--warn);font-weight:700}
.trash{background:none;border:1px solid var(--line);border-radius:12px;width:42px;height:42px;display:grid;place-items:center;color:var(--mute);flex-shrink:0;align-self:flex-start;padding:0;transition:.15s}
.trash:hover,.trash:focus-visible{color:var(--warn);border-color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--card))}
.trash .i{margin:0;width:20px;height:20px}
.hbtns{position:relative;display:flex;gap:10px;flex-wrap:wrap}
.btn.warnb{color:var(--warn)}
.markw{position:relative;display:block;flex-shrink:0}
.mark{border:0;padding:0;overflow:hidden;cursor:pointer}
.mark img,.tic img{width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit}
.cam{position:absolute;right:-5px;bottom:-5px;width:22px;height:22px;border-radius:50%;background:var(--card);border:1px solid var(--gold2);display:grid;place-items:center;color:var(--gold);pointer-events:none}
.cam .i{width:12px;height:12px;margin:0}
nav .ic.has{padding:0;overflow:hidden}
.navimg{width:36px;height:36px;object-fit:cover;display:block}
.pban{height:190px;border-radius:26px;background:linear-gradient(135deg,color-mix(in srgb,var(--gold2) 80%,#fff),color-mix(in srgb,var(--gold) 70%,var(--gold2)) 50%,var(--gold)) center/cover;position:relative;box-shadow:var(--shadow);cursor:pointer}
.pcam{position:absolute;right:14px;top:14px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;background:color-mix(in srgb,var(--card) 92%,transparent);border:1px solid var(--line);border-radius:99px;padding:7px 14px;font-size:.88rem;color:var(--ink)}
.pcam .i{color:var(--gold)}
.pcam.round{top:auto;right:-2px;bottom:-2px;padding:9px;border-radius:50%}
.pcam.round .i{margin:0}
.phead{display:flex;gap:18px;align-items:flex-end;padding:0 12px;margin:-58px 0 16px;position:relative}
.pav{position:relative;width:118px;height:118px;border-radius:50%;border:5px solid var(--card);background:linear-gradient(135deg,var(--gold2),var(--gold));box-shadow:var(--shadow);display:grid;place-items:center;color:var(--onbtn);font:700 3rem var(--serif);flex-shrink:0}
.pav img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.phead>div:last-child{padding-bottom:6px;min-width:0}
.pname{font:700 2rem/1.15 var(--serif);margin:0;overflow-wrap:anywhere}
.pintro{margin:10px 0 0;color:var(--mute)}
@media(max-width:800px){.pban{height:130px;border-radius:22px}.phead{margin-top:-46px;gap:12px}.pav{width:96px;height:96px;font-size:2.4rem}.pname{font-size:1.55rem}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 18px;box-shadow:var(--shadow)}
.tog{display:flex;gap:12px;align-items:center;font-weight:700;margin:0;font-size:1.05rem}
.tog input{width:26px;height:26px;accent-color:var(--gold)}
.nrow{display:flex;gap:10px;align-items:center;margin:8px 0;flex-wrap:wrap}
.nrow select,.nrow input{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.nrow .trash{align-self:center}
.panel .bar{margin-top:10px}
.presets{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.preset{display:inline-flex;align-items:center;gap:8px;padding:7px 16px 7px 7px;border:1px solid var(--line);border-radius:99px;background:var(--card)}
.preset .sw{width:28px;height:28px;border-radius:50%;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 15%,transparent)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-bottom:12px}
.cpick{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 12px;font-weight:400;margin:0}
.cpick input{width:46px;height:36px;border:0;padding:0;background:none;cursor:pointer;flex-shrink:0}
.cpick span{font-size:.95rem}
.sub3{font:700 1.15rem var(--serif);margin:18px 0 10px}
</style>
</head>
<body>
<aside>
 <div class="logo"><span class="markw"><button class="mark" id="mark" aria-label="Changer la photo" title="Changer la photo"></button><span class="cam" id="cam"></span></span><div><b>Mon carnet</b><small>Tout, au même endroit</small></div></div><div class="rule"></div>
 <div class="navt">Catégories</div>

 <nav id="nav" aria-label="Catégories"></nav>
 <div class="side-foot">
  <div class="status" id="status"></div>
  <button id="addCat">Nouvelle catégorie</button>
  <button id="install">Installer l’application</button>
  <button id="save">Sauvegarder mes données</button>
  <button id="load">Restaurer une sauvegarde</button>
 </div>
</aside>
<div id="scrim"></div>
<main><div class="wrap">
 <div class="warn" id="warn" hidden></div>
 <div class="top">
  <button id="menu" aria-label="Ouvrir le menu"></button>
  <input id="q" type="search" placeholder="Rechercher partout (ex : classeur, dentiste…)" aria-label="Rechercher">
 </div>
 <section id="hero" class="hero"><span class="deco" id="deco"></span><div class="hdate" id="hdate"></div><h2 id="hello"></h2><p class="hsum" id="hsum"></p><div class="hbtns"><button class="btn" id="install2">Installer l’application</button><button class="btn" id="hname">Changer le prénom</button></div></section>
 <div id="tiles" class="tiles"></div>
 <div id="soon"></div>
 <section id="prof" hidden></section>
 <div id="head"><h2 id="title"></h2>
 <p class="sub" id="sub"></p>
 <div class="line"></div>
 <div class="bar">
  <button class="btn" id="add">Ajouter</button>
  <button class="btn ghost" id="edCat">Modifier la catégorie</button>
  <button class="btn ghost warnb" id="clean" hidden></button>
 </div></div>
 <div class="quick" id="quick" hidden><input id="qa" placeholder="Écrire un article puis Entrée (ex : lait)" aria-label="Ajouter un article"><button class="btn" id="qb">Ajouter</button></div>
 <div class="list" id="list"></div>
</div></main>

<dialog id="dProf"><form method="dialog" id="fProf">
 <h3 id="pT">Mes informations</h3><p class="pintro" id="pIntro"></p>
 <label for="p_first">Prénom</label><input id="p_first" required autocomplete="given-name">
 <label for="p_last">Nom</label><input id="p_last" autocomplete="family-name">
 <label for="p_email">Adresse e-mail</label><input id="p_email" type="email" autocomplete="email">
 <label>Date de naissance (facultatif)</label>

function carnetDue(S,last,now){
 const N=S.notify||{};if(!N.on||!(N.rem||[]).length)return[];
 const MON=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
 const cats={};(S.cats||[]).forEach(c=>cats[c.id]=c);
 const t0=new Date(now);t0.setHours(0,0,0,0);
 const ev=[];
 (S.items||[]).forEach(i=>{const c=cats[i.cat];if(!c||i.done)return;
  if(c.type==='birthday'||c.type==='person'){const d=+i.bd,m=MON.indexOf(i.bm);if(!d||m<0)return;
   [t0.getFullYear(),t0.getFullYear()+1].forEach(y=>ev.push({d:new Date(y,m,d),i,c,b:1}))}
  else if(i.date){const p=i.date.split('-');ev.push({d:new Date(+p[0],+p[1]-1,+p[2]),i,c})}});
 const G={};
 ev.forEach(e=>{if(e.d<t0)return;N.rem.forEach(r=>{const hm=(r.t||'09:00').split(':');
  const f=new Date(e.d.getFullYear(),e.d.getMonth(),e.d.getDate()-(+r.d||0),+hm[0],+hm[1]).getTime();
  if(f>last&&f<=now){const k=f+'|'+r.d;(G[k]=G[k]||{f,d:+r.d||0,l:[]}).l.push(e)}})});
 return Object.keys(G).map(k=>{const g=G[k],n=g.l.length,lab=g.d===0?'Aujourd’hui':g.d===1?'Demain':'Dans '+g.d+' jours',late=now-g.f>20*60000;
  const lines=g.l.map(e=>{const i=e.i;if(e.b){const age=+i.by>1900?' ('+(e.d.getFullYear()-i.by)+' ans)':'';return 'Anniversaire de '+i.title+age}
   return i.title+(i.time?' à '+i.time:'')+' · '+e.c.name});
  return{tag:'carnet-'+k,title:(late?'Rappel manqué · ':'')+lab+(n>1?' : '+n+' choses':''),body:lines.join('\n')}})}

  if(p!=='granted'){N.on=false;render();toast('Notifications refusées');return}

  try{const reg=await navigator.serviceWorker.ready;if(reg.periodicSync)await reg.periodicSync.register('carnet-check',{minInterval:3600000})}catch(e){}
 }else N.on=false;
 render();toast(v?'Rappels activés':'Rappels désactivés');
}
const RD=[[0,'Le jour même'],[1,'La veille'],[2,'2 jours avant'],[3,'3 jours avant'],[7,'1 semaine avant'],[14,'2 semaines avant']];
function notifHTML(){

 return `<div class="sec">Rappels</div><div class="panel">
 <label class="tog"><input type="checkbox" id="nOn" ${N.on?'checked':''}>Activer les rappels</label>
 <p class="m">${pt}</p>
 <div class="m"><b>Me prévenir :</b></div>
 ${N.rem.map((r,k)=>`<div class="nrow" data-k="${k}"><select data-nd aria-label="Quand">${RD.map(([v,l])=>`<option value="${v}" ${v==r.d?'selected':''}>${l}</option>`).join('')}</select><span>à</span><input type="time" data-nt value="${esc(r.t)}" aria-label="Heure"><button class="trash" data-nrm="${k}" aria-label="Retirer ce rappel">${ic('trash')}</button></div>`).join('')}
 <div class="bar"><button class="btn ghost" id="nAddRow">${ic('plus')}Ajouter un rappel</button><button class="btn ghost" id="nTest">Tester</button></div>
 <p class="m" style="margin-top:12px">Tous les rendez-vous, échéances et anniversaires datés sont regroupés dans une seule notification à l’heure choisie. Les rappels arrivent à l’heure quand l’application est ouverte ou active en arrière-plan ; fermée, le téléphone peut les retarder. Pour être sûre de les recevoir à la minute près, ajoutez-les à l’agenda du téléphone :</p>

}
function exportICS(){
 const rems=(S.notify&&S.notify.rem&&S.notify.rem.length)?S.notify.rem:[{d:1,t:'09:00'}];
 const e=v=>String(v==null?'':v).replace(/\\/g,'\\\\').replace(/[,;]/g,m=>'\\'+m).replace(/\r?\n/g,'\\n');
 const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
 const out=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Mon carnet//FR','CALSCALE:GREGORIAN'];let n=0;
 S.items.forEach(i=>{const c=cat(i.cat);if(!c||i.done)return;const b=!!typ(c).eff,date=b?bNext(i):i.date;if(!date)return;
  const tm=(c.type==='rdv'&&i.time)?i.time:'',ymd=date.replace(/-/g,'');
  out.push('BEGIN:VEVENT','UID:'+i.id+'@mon-carnet','DTSTAMP:'+stamp);
  if(tm)out.push('DTSTART:'+ymd+'T'+tm.replace(':','')+'00','DURATION:PT1H');else out.push('DTSTART;VALUE=DATE:'+ymd);
  out.push('SUMMARY:'+e((b?'Anniversaire : ':'')+i.title));
  const desc=[c.name,i.where,i.who,i.note].filter(Boolean).join(' · ');if(desc)out.push('DESCRIPTION:'+e(desc));
  if(b)out.push('RRULE:FREQ=YEARLY');
  const em=tm?(+tm.split(':')[0]*60+ +tm.split(':')[1]):0;
  rems.forEach(r=>{const hm=(r.t||'09:00').split(':'),M=(+r.d||0)*1440-(+hm[0]*60+ +hm[1])+em,A=Math.abs(M);
   out.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+e(i.title),'TRIGGER:'+(M>=0?'-':'')+'P'+Math.floor(A/1440)+'DT'+Math.floor(A%1440/60)+'H'+A%60+'M','END:VALARM')});
  out.push('END:VEVENT');n++});
 out.push('END:VCALENDAR');
 if(!n){toast('Rien à exporter pour le moment');return}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out.join('\r\n')],{type:'text/calendar'}));a.download='mon-carnet.ics';a.click();toast('Fichier agenda téléchargé');
}
