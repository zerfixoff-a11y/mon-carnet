<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon carnet</title>
<meta name="theme-color" content="#1f6f6b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f2f6f5;--card:#fff;--ink:#1d2b2c;--mute:#5d6f70;--main:#1f6f6b;--main-ink:#fff;--side:#173f3d;--line:#d5e0df;--warn:#b3402a}
@media(prefers-color-scheme:dark){:root{--bg:#121a1a;--card:#1b2625;--ink:#e8f0ef;--mute:#9bb0ae;--main:#4fb3ac;--main-ink:#08201f;--side:#0c1413;--line:#2b3a39;--warn:#ff8e75}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:18px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--main);outline-offset:2px}
aside{width:270px;background:var(--side);color:#e8f0ef;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);flex-shrink:0}
aside h1{font-size:1.3rem;margin:0;padding:20px 20px 12px}
nav{flex:1;overflow-y:auto;padding:0 10px}
nav button{display:flex;width:100%;align-items:center;gap:12px;background:none;border:0;color:inherit;text-align:left;padding:12px;border-radius:12px;margin-bottom:2px}
nav button:hover{background:rgba(255,255,255,.08)}
nav button.on{background:#e8f0ef;color:#173f3d;font-weight:700}
nav .ic{font-size:1.4rem;width:1.8rem;text-align:center}
nav .n{margin-left:auto;font-size:.85rem;opacity:.75}
.side-foot{padding:12px 10px;border-top:1px solid rgba(255,255,255,.15);display:grid;gap:6px}
.side-foot button{background:rgba(255,255,255,.1);border:0;color:inherit;padding:10px;border-radius:10px;font-size:.9rem}
main{flex:1;min-width:0;overflow-y:auto;padding:20px 28px calc(40px + env(safe-area-inset-bottom))}
.top{display:flex;gap:10px;align-items:center;margin-bottom:16px}
#menu{display:none;background:var(--main);color:var(--main-ink);border:0;border-radius:12px;padding:10px 14px;font-size:1.2rem}
.top input{flex:1;padding:12px 16px;border:2px solid var(--line);border-radius:12px;background:var(--card);min-width:0}
h2{font-size:1.9rem;margin:8px 0 4px}
.sub{color:var(--mute);margin:0 0 18px}
.btn{background:var(--main);color:var(--main-ink);border:0;border-radius:12px;padding:12px 20px;font-weight:700}
.btn.ghost{background:none;color:var(--ink);border:2px solid var(--line)}
.btn.del{background:none;color:var(--warn);border:2px solid var(--warn)}
.list{display:grid;gap:12px;margin-top:18px;max-width:760px}
.item{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--main);border-radius:14px;padding:14px 16px;display:flex;gap:14px;align-items:flex-start}
.item.done{opacity:.55;border-left-color:var(--mute)}
.item.done .t{text-decoration:line-through}
.item input[type=checkbox]{width:26px;height:26px;margin-top:3px;accent-color:var(--main);flex-shrink:0}
.item .body{flex:1;min-width:0;cursor:pointer}
.t{font-weight:700;overflow-wrap:anywhere}
.meta{color:var(--mute);font-size:.95rem;margin-top:2px;overflow-wrap:anywhere}
.tag{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:0 8px;margin-right:6px;font-size:.9rem}
.empty{color:var(--mute);padding:30px 0}
dialog{border:0;border-radius:18px;padding:22px;width:min(94vw,520px);background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h3{margin:0 0 12px}
label{display:block;font-weight:600;margin:12px 0 4px}
dialog input,dialog textarea,dialog select{width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--bg)}
.row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.row .sp{flex:1}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
#scrim{display:none}
@media(max-width:800px){
 aside{position:fixed;inset:0 auto 0 0;z-index:20;transform:translateX(-100%);transition:transform .2s;width:min(300px,85vw)}
 body.open aside{transform:none}
 body.open #scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10}
 #menu{display:block}
 main{padding:calc(14px + env(safe-area-inset-top)) 14px 40px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<aside>
 <h1>📒 Mon carnet</h1>
 <nav id="nav" aria-label="Catégories"></nav>
 <div class="side-foot">
  <button id="addCat">＋ Nouvelle catégorie</button>
  <button id="install" hidden>📲 Installer l’application</button>
  <button id="save">💾 Sauvegarder mes données</button>
  <button id="load">📂 Restaurer une sauvegarde</button>
 </div>
</aside>
<div id="scrim"></div>
<main>
 <div class="top">
  <button id="menu" aria-label="Ouvrir le menu">☰</button>
  <input id="q" type="search" placeholder="Rechercher partout (ex : classeur, dentiste…)" aria-label="Rechercher">
 </div>
 <h2 id="title"></h2>
 <p class="sub" id="sub"></p>
 <div style="display:flex;gap:10px;flex-wrap:wrap">
  <button class="btn" id="add">＋ Ajouter</button>
  <button class="btn ghost" id="edCat">Modifier la catégorie</button>
 </div>
 <div class="list" id="list"></div>
</main>

<dialog id="dItem"><form method="dialog" id="fItem">
 <h3 id="dItemT">Nouvelle fiche</h3>
 <label for="iTitle">Quoi ?</label><input id="iTitle" required placeholder="ex : Document AB">
 <label for="iWhere">Où c’est rangé ?</label><input id="iWhere" placeholder="ex : Classeur bleu, tiroir du haut">
 <label for="iDate">Date (facultatif)</label><input id="iDate" type="date">
 <label for="iCat">Catégorie</label><select id="iCat"></select>
 <label for="iNote">Notes</label><textarea id="iNote" rows="3"></textarea>
 <div class="row"><button type="button" class="btn del" id="iDel">Supprimer</button><span class="sp"></span><button type="button" class="btn ghost" id="iCancel">Annuler</button><button class="btn">Enregistrer</button></div>
</form></dialog>

<dialog id="dCat"><form method="dialog" id="fCat">
 <h3 id="dCatT">Catégorie</h3>
 <label for="cName">Nom</label><input id="cName" required>
 <label for="cIcon">Icône (un emoji)</label><input id="cIcon" maxlength="4" placeholder="📁">
 <div class="row"><button type="button" class="btn del" id="cDel">Supprimer</button><span class="sp"></span><button type="button" class="btn ghost" id="cCancel">Annuler</button><button class="btn">Enregistrer</button></div>
</form></dialog>

<dialog id="dIos"><h3>Installer sur iPhone / iPad</h3><p>Touchez le bouton <b>Partager</b> (carré avec une flèche), puis <b>Sur l’écran d’accueil</b>.</p><div class="row"><span class="sp"></span><button class="btn" onclick="this.closest('dialog').close()">Compris</button></div></dialog>
<input type="file" id="file" accept="application/json" hidden>
<div id="toast" role="status"></div>

<script>
const KEY='mon-carnet-v1';
const DEF=[['🩺','Médical'],['📅','Rendez-vous'],['📄','Documents et classeurs'],['🏛️','Administratif'],['💶','Argent et factures'],['🛒','Courses'],['🏠','Maison'],['📞','Contacts utiles'],['💊','Médicaments'],['📝','Notes en vrac']];
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.cats){S={cats:DEF.map(([icon,name],i)=>({id:'c'+i,icon,name})),items:[],cur:'c0'}}
const $=id=>document.getElementById(id);
const uid=()=>Math.random().toString(36).slice(2,9);
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Impossible d’enregistrer sur cet appareil')}}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200)}
const cat=id=>S.cats.find(c=>c.id===id);
const fmt=d=>d?new Date(d+'T12:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}):'';
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(){
 if(!cat(S.cur)&&S.cur!=='all')S.cur=S.cats[0]?.id||'all';
 const q=$('q').value.trim().toLowerCase();
 $('nav').innerHTML=`<button data-c="all" class="${S.cur==='all'?'on':''}"><span class="ic">🗂️</span>Tout voir<span class="n">${S.items.length}</span></button>`+
  S.cats.map(c=>`<button data-c="${c.id}" class="${S.cur===c.id?'on':''}"><span class="ic">${esc(c.icon)}</span>${esc(c.name)}<span class="n">${S.items.filter(i=>i.cat===c.id&&!i.done).length||''}</span></button>`).join('');
 const c=cat(S.cur);
 $('title').textContent=q?'Résultats de la recherche':c?c.name:'Tout voir';
 $('sub').textContent=q?'Dans toutes les catégories':c?'Tout ce qui concerne « '+c.name+' »':'Toutes les catégories réunies';
 $('edCat').hidden=!c||!!q;
 let items=S.items.filter(i=>(q||S.cur==='all'||i.cat===S.cur)&&(!q||[i.title,i.where,i.note,cat(i.cat)?.name].join(' ').toLowerCase().includes(q)));
 items.sort((a,b)=>(a.done-b.done)||((a.date||'9')>(b.date||'9')?1:-1));
 $('list').innerHTML=items.length?items.map(i=>`<div class="item ${i.done?'done':''}" data-i="${i.id}">
  <input type="checkbox" ${i.done?'checked':''} aria-label="Fait">
  <div class="body" tabindex="0"><div class="t">${esc(i.title)}</div>
  <div class="meta">${S.cur==='all'||q?`<span class="tag">${esc(cat(i.cat)?.icon)} ${esc(cat(i.cat)?.name)}</span>`:''}${i.where?'📍 '+esc(i.where):''}</div>
  ${i.date?`<div class="meta">🗓️ ${fmt(i.date)}</div>`:''}${i.note?`<div class="meta">${esc(i.note)}</div>`:''}</div></div>`).join('')
  :`<div class="empty">Rien ici pour l’instant. Touchez « Ajouter » pour commencer.</div>`;
 save();
}
$('nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.cur=b.dataset.c;$('q').value='';document.body.classList.remove('open');render()};
$('menu').onclick=()=>document.body.classList.add('open');
$('scrim').onclick=()=>document.body.classList.remove('open');
$('q').oninput=render;
// fiches
let editing=null;
function openItem(id){
 editing=id?S.items.find(i=>i.id===id):null;
 $('iCat').innerHTML=S.cats.map(c=>`<option value="${c.id}">${esc(c.icon)} ${esc(c.name)}</option>`).join('');
 $('dItemT').textContent=editing?'Modifier la fiche':'Nouvelle fiche';
 $('iTitle').value=editing?.title||'';$('iWhere').value=editing?.where||'';$('iDate').value=editing?.date||'';$('iNote').value=editing?.note||'';
 $('iCat').value=editing?.cat||(cat(S.cur)?S.cur:S.cats[0]?.id);
 $('iDel').hidden=!editing;$('dItem').showModal();
}
$('add').onclick=()=>openItem();
$('iCancel').onclick=()=>$('dItem').close();
$('fItem').onsubmit=()=>{
 const d={title:$('iTitle').value.trim(),where:$('iWhere').value.trim(),date:$('iDate').value,note:$('iNote').value.trim(),cat:$('iCat').value};
 if(editing)Object.assign(editing,d);else S.items.push({id:uid(),done:false,...d});
 render();toast('Enregistré ✓');
};
$('iDel').onclick=()=>{if(confirm('Supprimer cette fiche ?')){S.items=S.items.filter(i=>i!==editing);$('dItem').close();render()}};
$('list').onclick=e=>{
 const it=e.target.closest('.item');if(!it)return;
 if(e.target.type==='checkbox'){const o=S.items.find(i=>i.id===it.dataset.i);o.done=e.target.checked;render()}
 else openItem(it.dataset.i);
};
$('list').onkeydown=e=>{if(e.key==='Enter'&&e.target.classList.contains('body'))openItem(e.target.closest('.item').dataset.i)};
// catégories
let editCat=null;
function openCat(c){editCat=c;$('dCatT').textContent=c?'Modifier la catégorie':'Nouvelle catégorie';$('cName').value=c?.name||'';$('cIcon').value=c?.icon||'📁';$('cDel').hidden=!c;$('dCat').showModal()}
$('addCat').onclick=()=>{document.body.classList.remove('open');openCat()};
$('edCat').onclick=()=>openCat(cat(S.cur));
$('cCancel').onclick=()=>$('dCat').close();
$('fCat').onsubmit=()=>{
 const n=$('cName').value.trim(),ic=$('cIcon').value.trim()||'📁';
 if(editCat){editCat.name=n;editCat.icon=ic}else{const c={id:uid(),name:n,icon:ic};S.cats.push(c);S.cur=c.id}
 render();
};
$('cDel').onclick=()=>{
 const n=S.items.filter(i=>i.cat===editCat.id).length;
 if(confirm(n?`Supprimer « ${editCat.name} » et ses ${n} fiche(s) ?`:`Supprimer « ${editCat.name} » ?`)){
  S.items=S.items.filter(i=>i.cat!==editCat.id);S.cats=S.cats.filter(c=>c!==editCat);$('dCat').close();render()}
};
// sauvegarde
$('save').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='mon-carnet-'+new Date().toISOString().slice(0,10)+'.json';a.click();toast('Sauvegarde téléchargée')};
$('load').onclick=()=>$('file').click();
$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!d.cats||!d.items)throw 0;if(confirm('Remplacer les données actuelles par cette sauvegarde ?')){S=d;render();toast('Données restaurées ✓')}}catch(_){toast('Fichier non valide')}e.target.value=''};
// installation
let dp;
const isIos=/iphone|ipad|ipod/i.test(navigator.userAgent)&&!navigator.standalone;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$('install').hidden=false});
if(isIos)$('install').hidden=false;
$('install').onclick=async()=>{if(dp){dp.prompt();await dp.userChoice;dp=null;$('install').hidden=true}else $('dIos').showModal()};
window.addEventListener('appinstalled',()=>{$('install').hidden=true});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
render();
</script>
</body>
</html>
